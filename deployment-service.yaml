apiVersion: apps/v1
kind: Deployment

metadata:
  name: django-todo-app-deploy
  labels:
    app: django-todo-app
    server: nginx

spec:
  replicas: 3
  selector:
    matchLabels:
      app: django-todo-app
      server: nginx

  template:
    metadata:
      labels:
        app: django-todo-app
        server: nginx

    spec:
      containers:
      - name: django-todo
        image: souvikdocks250/todoapp:v1
        imagePullPolicy: Always
        ports:
          - containerPort: 80
            name: nginx
        volumeMounts:
        - name: custom-defaultconf-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
      - name: custom-defaultconf-config
        configMap:
          name: custom-defaultconf
---
apiVersion: v1
kind: Service
metadata:
  name: django-todo-app-service
  labels:
    app: django-todo-app
    server: nginx

spec:
  type: NodePort
  selector:
    app: django-todo-app
    server: nginx

  ports:
    - name: nginx-proxy-port
      port: 8080
      targetPort: 80
